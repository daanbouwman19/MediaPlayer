# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
    ignore:
      # TypeScript 7 ships no JS compiler API, so vue-tsc cannot type-check
      # .vue files on it yet. Remove once vue-tsc supports TS 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # vite-plus, its `vite` core alias and the `vitest` pin must move together.
      # Upgrade them with `npx --package=vite-plus@<version> vp migrate --no-interactive`.
      - dependency-name: 'vite-plus'
      - dependency-name: 'vite'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/*'
    groups:
      npm-dependencies:
        patterns:
          - '*'
