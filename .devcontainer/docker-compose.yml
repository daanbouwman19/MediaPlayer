services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/home/builduser/app
      - node_modules_cache:/home/builduser/app/node_modules
    working_dir: /home/builduser/app

    environment:
      - DISPLAY=:1
      - HOME=/home/builduser
      # The dev servers bind loopback by default; listen on all interfaces
      # inside the container so the published Vite port below reaches them.
      - HOST=0.0.0.0

    ports:
      - '5901:5901' # VNC Server
      - '6080:6080' # noVNC Web Client
      - '127.0.0.1:5173:5173' # Vite Dev Server (this machine only)

    command: sleep infinity

volumes:
  node_modules_cache:
